let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2400)}
const ov=$("#ov"),sheet=$(".sheet",ov),shT=$("#sh-title"),shS=$("#sh-sub"),shB=$("#sh-body");let opener=null;
function open(title,sub,html,wide){
  if(ov.hidden){opener=document.activeElement;ov.hidden=false;document.documentElement.classList.add("lock")}
  sheet.classList.toggle("wide",!!wide);shT.textContent=title;shS.textContent=sub||"";shS.hidden=!sub;shB.innerHTML=html;shB.scrollTop=0;hydrate(shB);sheet.focus({preventScroll:true});
}
function closeSheet(){ov.hidden=true;document.documentElement.classList.remove("lock");if(opener&&opener.focus&&document.contains(opener))opener.focus();opener=null}
ov.addEventListener("click",e=>{if(e.target===ov)closeSheet()});
document.addEventListener("keydown",e=>{
  if(!$("#cf").hidden&&e.key==="Escape"){$("#cf-no").click();return}
  if(ov.hidden)return;
  if(e.key==="Escape"){closeSheet();return}
  if(e.key==="Tab"){
    const f=$$('a[href],button:not([disabled]),input:not([disabled]),select,textarea',sheet).filter(x=>!x.hidden&&x.offsetParent!==null);if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===a||document.activeElement===sheet)){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  }
});

let io=null;
function reveal(root){
  const els=$$(".reveal:not(.in)",root||document);
  if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}}),{threshold:.08});
  els.forEach(e=>io.observe(e));
}

function openWA(url){
  const mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&matchMedia("(pointer:coarse)").matches);
  if(mobile){
    /* phones: same-tab navigation is never blocked and wa.me hands over to the WhatsApp app */
    try{window.location.href=url;return}catch(e){}
    try{window.open(url,"_blank")}catch(e){}
  }else{
    /* desktop: keep the shop page open in this tab, WhatsApp Web in a new one */
    let w=null;try{w=window.open(url,"_blank")}catch(e){}
    if(!w){try{window.location.href=url}catch(e){}}
  }
}

async function importData(file){
  if(!file)return;
  let d;try{d=JSON.parse(await file.text())}catch(e){toast("JSON ফাইল পড়া যায়নি");return}
  if(!d||typeof d!=="object"||!["products","orders","services","speeds","settings"].some(k=>k in d)){toast("এটি সঠিক backup ফাইল নয়");return}
  for(const k of["products","orders","services","speeds"])if(k in d&&!Array.isArray(d[k])){toast("ফাইলের "+k+" ঠিক নয়");return}
  if(!await ask("Import করলে বর্তমান data বদলে যাবে। চালিয়ে যাবেন?","হ্যাঁ, Import করুন","না"))return;
  if(d.products)S.products=d.products;if(d.orders)S.orders=d.orders;if(d.services)S.services=d.services;if(d.speeds&&d.speeds.length)S.speeds=d.speeds;
  if(d.settings&&typeof d.settings==="object")S.settings=Object.assign({},DEF_SET,d.settings,{passHash:S.settings.passHash});
  S.cart=S.cart.filter(c=>prod(c.pid));
  save.p();save.o();save.s();save.sp();save.st();save.c();renderBadge();applyLang();renderAdmin();toast("Import সম্পন্ন ✅");
}

function imgResize(file,maxW,maxKB){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type))return rej(new Error("ছবির ফাইল দিন।"));
  const fr=new FileReader();fr.onerror=()=>rej(new Error("ফাইল পড়া যায়নি।"));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("ছবি খোলা যায়নি।"));
    im.onload=()=>{let w=im.width,h=im.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
      const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      let q=.85,d=c.toDataURL("image/jpeg",q);while(d.length*.75>maxKB*1024&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}
      if(d.length*.75>maxKB*1024)return rej(new Error("ছবি "+maxKB+"KB-এর বেশি, ছোট ছবি দিন।"));res(d)};im.src=fr.result};
  fr.readAsDataURL(file)})}

document.addEventListener("change",e=>{const el=e.target;
  if(el.matches&&el.matches('input[name="sp"]')){S.speed=+el.value;el.closest(".speeds").querySelectorAll(".sp").forEach(l=>l.classList.toggle("on",l.querySelector("input").checked));return}
  const k=el.dataset&&el.dataset.ch;if(k&&CHG[k])CHG[k](el)});
document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches('input[name="sp"]'))e.target.closest(".sp").classList.toggle("focus",e.target.matches(":focus-visible"))});
document.addEventListener("focusout",e=>{if(e.target.matches&&e.target.matches('input[name="sp"]'))e.target.closest(".sp").classList.remove("focus")});
document.addEventListener("submit",e=>{const f=e.target;if(!f.dataset||!f.dataset.f)return;e.preventDefault();
  ({login:doLogin,checkout:submitCheckout,booking:submitBooking,product:()=>saveProduct(f),aorder:saveAOrder,service:()=>saveService(f),speed:()=>saveSpeed(f),settings:saveSettings,pw:changePw})[f.dataset.f]()});
window.addEventListener("hashchange",route);

/* ---------- clock + init ---------- */
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"],p2=n=>String(n).padStart(2,"0");
function tick(){const d=new Date(),c=$("#clk");if(c)c.textContent=p2(d.getDate())+" "+MON[d.getMonth()]+" "+d.getFullYear()+"  "+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds())}
$("#yr").textContent=new Date().getFullYear();
load();setTheme(S.theme);hydrate();applyLang();renderBadge();route();reveal();
setInterval(tick,1000);
})();
</script>
</body>
